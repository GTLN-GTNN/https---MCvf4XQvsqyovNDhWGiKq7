<script>
const R = String.raw;

/* ===== Dữ liệu đề và đáp án ===== */
const P1 = [
 {q:R`Cho hàm số \(f(x)=\dfrac{2x+m}{x-3}\) (với \(m\) là tham số). Giá trị của \(m\) để \(\max_{[-1;2]}f(x)+\min_{[-1;2]}f(x)=8\) là`,
  o:[R`\(m=\frac45\)`,R`\(m=-\frac{46}{5}\)`,R`\(m=-12\)`,R`\(m=\frac{18}{5}\)`],a:1},
 {q:R`Cho hàm số \(y=x+\cos^2x+m\) (\(m\) là tham số). Với giá trị nào của tham số \(m\) thì \(\min_{[0;\frac{\pi}{4}]}y=4\)?`,
  o:[R`\(m=3\)`,R`\(m=\frac34\)`,R`\(m=\frac52\)`,R`\(m=0\)`],a:0},
 {q:R`Cho hàm số \(f(x)=x^3-3x+m\). Biết \(\max_{(-\infty;0)}f(x)=5\). Giá trị nhỏ nhất của hàm số \(y=f(x)\) trên \((0;+\infty)\) là`,
  o:[R`\(\min_{(0;+\infty)}f(x)=1\)`,R`\(\min_{(0;+\infty)}f(x)=2\)`,R`\(\min_{(0;+\infty)}f(x)=3\)`,R`\(\min_{(0;+\infty)}f(x)=-1\)`],a:0},
 {q:R`Cho hàm số \(y=(x+m)^3-3(x+m)+1+n\). Biết hàm số nghịch biến trên khoảng \((0;2)\) và giá trị lớn nhất của hàm số trên \([-1;1]\) bằng 4. Tính \(m+n\).`,
  o:[R`\(m+n=0\)`,R`\(m+n=2\)`,R`\(m+n=-1\)`,R`\(m+n=1\)`],a:0},
 {q:R`Biết giá trị lớn nhất của hàm số \(y=x+\sqrt{4-x^2}+m\) là \(3\sqrt2\). Giá trị của \(m\) là`,
  o:[R`\(m=2\sqrt2\)`,R`\(m=-\sqrt2\)`,R`\(m=\frac{\sqrt2}{2}\)`,R`\(m=\sqrt2\)`],a:3},
 {q:R`Cho hàm số \(f(x)=x^3-3x+m\) (với \(m\) là tham số thực). Biết \(\max_{(-\infty;0)}f(x)=5\). Giá trị nhỏ nhất của hàm số \(y=f(x)\) trên \((0;+\infty)\) là`,
  o:[R`\(\min_{(0;+\infty)}f(x)=1\)`,R`\(\min_{(0;+\infty)}f(x)=2\)`,R`\(\min_{(0;+\infty)}f(x)=3\)`,R`\(\min_{(0;+\infty)}f(x)=-1\)`],a:0},
 {q:R`Cho hàm số \(y=\dfrac{x+m}{x-1}\) (\(m\) là tham số thực). Gọi \(m_0\) là giá trị của \(m\) thỏa mãn \(\min_{[2;4]}y=3\). Mệnh đề nào dưới đây đúng?`,
  o:[R`\(m_0<-1\)`,R`\(m_0>4\)`,R`\(1\le m_0<3\)`,R`\(3\lt m_0\le4\)`],a:1},
 {q:R`Cho hàm số \(f(x)=10^x+x\) và hàm số \(g(x)=x^3-mx^2+(m^2+1)x-2\). Gọi \(M\) là giá trị lớn nhất của hàm số \(g\big(x+f(x)\big)\) trên đoạn \([0;1]\). Khi \(M\) đạt giá trị nhỏ nhất thì giá trị của tham số \(m\) bằng`,
  o:[R`\(\frac{21}{2}\)`,R`\(6\)`,R`\(21\)`,R`\(5\)`],a:1},
 {q:R`Tìm tất cả các giá trị thực của tham số \(m\) để giá trị nhỏ nhất của hàm số \(y=-x^3-3x^2+m\) trên đoạn \([-1;2]\) bằng 1.`,
  o:[R`\(m=20\)`,R`\(m=19\)`,R`\(m=18\)`,R`\(m=21\)`],a:3},
 {q:R`Có bao nhiêu giá trị nguyên của tham số \(m\) để hàm số \(y=\dfrac{x-m^2}{x+8}\) có giá trị nhỏ nhất trên \([0;3]\) bằng \(-\dfrac92\)?`,
  o:['0','2','3','1'],a:1},
 {q:R`Cho hàm số \(y=\left(x^3-3x-m+1\right)^2\). Tổng tất cả các giá trị của tham số \(m\) sao cho giá trị nhỏ nhất của hàm số trên đoạn \([-1;1]\) bằng 4 là`,
  o:[R`\(-2\)`,R`\(2\)`,R`\(-4\)`,R`\(4\)`],a:0},
 {q:R`Cho hàm số \(y=\dfrac{x-m^2}{x-8}\) với \(m\) là tham số thực. Giả sử \(m_0\) là giá trị dương của tham số \(m\) để hàm số có giá trị nhỏ nhất trên đoạn \([0;3]\) bằng \(m\). Giá trị \(m_0\) thuộc khoảng nào sau đây?`,
  o:[R`\((20;25)\)`,R`\((6;9)\)`,R`\((5;6)\)`,R`\((2;5)\)`],a:3},
];
const P2 = [
 {q:R`Cho hàm số \(y=\dfrac{x-m^2-2}{x-m}\), với \(m\) là tham số.`,
  s:[R`Tập xác định của hàm số là \(D=\mathbb{R}\).`,
     R`Khi \(m=1\) thì hàm số đồng biến trên mỗi khoảng \((-\infty;1)\) và \((1;+\infty)\).`,
     R`Khi \(m=1\) thì trên đoạn \([1;4]\) hàm số đạt giá trị lớn nhất bằng \(\frac12\).`,
     R`Có duy nhất 1 giá trị của tham số \(m\) để giá trị lớn nhất của hàm số trên đoạn \([0;4]\) bằng \(-1\).`],a:[0,1,0,1]},
 {q:R`Cho hàm số \(f(x)=x^3-3x+m\), với \(m\) là tham số.`,
  s:[R`Khi \(m=0\) thì hàm số đồng biến trên khoảng \((-1;1)\).`,
     R`Khi \(m=0\) thì hàm số có hai điểm cực trị.`,
     R`Giá trị nhỏ nhất của hàm số trên đoạn \([0;2]\) bằng \(m-2\).`,
     R`Gọi \(S\) là tập tất cả các giá trị của tham số \(m\) sao cho giá trị lớn nhất của hàm số \(y=|f(x)|\) trên đoạn \([0;2]\) bằng 3. Khi đó \(S\) có một phần tử.`],a:[0,1,1,0]},
 {q:R`Cho hàm số \(y=mx+\dfrac{36}{x+1}\), với \(m\) là tham số.`,
  s:[R`Hàm số đã cho nghịch biến trên đoạn \([0;3]\) khi \(m\le0\).`,
     R`Khi \(m\le0\) thì giá trị nhỏ nhất của hàm số trên đoạn \([0;3]\) là \(3m+9\).`,
     R`Khi \(\frac94\le m\le36\) thì giá trị nhỏ nhất của hàm số \(y=mx+\frac{36}{x+1}\) trên \([0;3]\) là \(-m+12\sqrt m\).`,
     R`Có đúng một giá trị nguyên của tham số \(m\) để giá trị nhỏ nhất của hàm số \(y=mx+\frac{36}{x+1}\) trên \([0;3]\) bằng 20.`],a:[1,1,1,0]},
 {q:R`Cho hàm số \(y=\dfrac{x^2+mx-1}{x+m}\), với \(m\) là tham số thực dương.`,
  s:[R`Tập xác định của hàm số là \(D=\mathbb{R}\).`,
     R`Trên đoạn \([2;4]\) thì đạo hàm của hàm số luôn nhận giá trị dương.`,
     R`Giá trị lớn nhất của hàm số trên đoạn \([2;4]\) là \(\min_{[2;4]}y=y(2)\).`,
     R`Chỉ có duy nhất một giá trị của tham số \(m\) để \(\min_{[2;4]}y=\frac95\).`],a:[0,1,0,1]},
];
const P3 = [
 {q:R`Cho hàm số \(f(x)=ax^3-4(a+2)x+1\) với \(a\) là tham số. Nếu \(\max_{(-\infty;0]}f(x)=f(-2)\) thì \(\max_{[0;3]}f(x)\) bằng bao nhiêu?`,a:'1'},
 {q:R`Cho hàm số \(f(x)=x^3+(1+m^2)x+1\). Gọi \(S\) là tập hợp tất cả các giá trị nguyên của tham số \(m\) để giá trị lớn nhất của hàm số trên đoạn \([0;1]\) không vượt quá 7. Số phần tử nguyên của \(S\) là bao nhiêu?`,a:'5'},
 {q:R`Có bao nhiêu giá trị của tham số \(m\) để hàm số \(y=f(x)=|4x-m|-x^2\) đạt giá trị lớn nhất bằng 5?`,a:'2'},
 {q:R`Cho hàm số \(f(x)=\dfrac{2\sqrt{x+1}+m}{\sqrt{x+1}+4}\) với \(m\) là tham số thực. Gọi \(S\) là tập hợp các giá trị nguyên dương của \(m\) để hàm số có giá trị lớn nhất trên đoạn \([-1;8]\) nhỏ hơn 3. Số phần tử của tập \(S\) là bao nhiêu?`,a:'11'},
];
const L='ABCD';
const TOTAL=P1.length+P2.length+P3.length;

/* ===== Dựng giao diện ===== */
const quiz=document.getElementById('quiz');
let h='';
h+=`<section class="part"><h2>Phần I. Trắc nghiệm nhiều lựa chọn</h2><p class="part-note">Mỗi câu chọn một đáp án. Mỗi câu đúng được 0,25 điểm.</p>`;
P1.forEach((p,i)=>{
  h+=`<div class="q" id="q1-${i}"><p class="q-head">Câu ${i+1}</p><p class="q-text">${p.q}</p><div class="opts">`;
  p.o.forEach((o,j)=>{h+=`<label class="opt" id="o1-${i}-${j}"><input type="radio" name="p1-${i}" value="${j}"><span><b>${L[j]}</b><em style="font-style:normal">${o}</em></span></label>`});
  h+=`</div></div>`;
});
h+=`</section><section class="part"><h2>Phần II. Đúng – Sai</h2><p class="part-note">Chọn Đúng hoặc Sai cho từng ý. Đúng 1 ý được 0,1 điểm, 2 ý được 0,25, 3 ý được 0,5, cả 4 ý được 1 điểm.</p>`;
P2.forEach((p,i)=>{
  h+=`<div class="q" id="q2-${i}"><p class="q-head">Câu ${i+1}</p><p class="q-text">${p.q}</p>`;
  p.s.forEach((s,j)=>{
    h+=`<div class="stmt" id="s2-${i}-${j}"><div class="stmt-t"><b>${'abcd'[j]})</b> ${s}</div><div class="tf"><label><input type="radio" name="p2-${i}-${j}" value="1"><span>Đúng</span></label><label><input type="radio" name="p2-${i}-${j}" value="0"><span>Sai</span></label></div></div>`;
  });
  h+=`</div>`;
});
h+=`</section><section class="part"><h2>Phần III. Trả lời ngắn</h2><p class="part-note">Nhập một số nguyên hoặc số thập phân. Mỗi câu đúng được 0,5 điểm.</p>`;
P3.forEach((p,i)=>{
  h+=`<div class="q" id="q3-${i}"><p class="q-head">Câu ${i+1}</p><p class="q-text">${p.q}</p><div class="short"><label for="a3-${i}">Đáp số</label><input type="text" id="a3-${i}" inputmode="decimal" autocomplete="off"></div></div>`;
});
h+=`</section>`;
quiz.innerHTML=h;

/* ===== Tiến độ ===== */
function norm(s){return s.trim().replace(',','.').replace(/\s+/g,'')}
function answered(){
  let n=0;
  P1.forEach((_,i)=>{if(document.querySelector(`input[name=p1-${i}]:checked`))n++});
  P2.forEach((p,i)=>{if(p.s.every((_,j)=>document.querySelector(`input[name=p2-${i}-${j}]:checked`)))n++});
  P3.forEach((_,i)=>{if(norm(document.getElementById('a3-'+i).value))n++});
  return n;
}
function prog(){
  const n=answered();
  document.getElementById('prog-t').textContent=`Đã làm ${n}/${TOTAL} câu`;
  document.getElementById('prog-p').textContent=Math.round(n/TOTAL*100)+'%';
  document.getElementById('fill').style.width=(n/TOTAL*100)+'%';
}
quiz.addEventListener('input',()=>{ if(!locked) prog(); });
prog();

/* ===== Chấm điểm ===== */
let locked=false;
const fmt=x=>(Math.round(x*100)/100).toString().replace('.',',');
const p2score=k=>[0,0.1,0.25,0.5,1][k];

function grade(){
  let s1=0,c1=0,s2=0,s3=0,c3=0;
  P1.forEach((p,i)=>{
    const sel=document.querySelector(`input[name=p1-${i}]:checked`);
    const ok=sel&&+sel.value===p.a;
    if(ok){s1+=0.25;c1++}
    mark(`q1-${i}`,ok,ok?'Đúng':`Sai · Đáp án đúng: ${L[p.a]}`);
    document.getElementById(`o1-${i}-${p.a}`).classList.add('right');
    if(sel&&!ok) document.getElementById(`o1-${i}-${sel.value}`).classList.add('wrong');
  });
  const p2k=[];
  P2.forEach((p,i)=>{
    let k=0;
    p.s.forEach((_,j)=>{
      const sel=document.querySelector(`input[name=p2-${i}-${j}]:checked`);
      const ok=sel&&+sel.value===p.a[j];
      if(ok)k++;
      const row=document.getElementById(`s2-${i}-${j}`);
      row.classList.add(ok?'right':'wrong');
      if(!ok){const f=document.createElement('div');f.className='fb';f.textContent=`Đáp án đúng: ${p.a[j]?'Đúng':'Sai'}`;row.appendChild(f)}
    });
    s2+=p2score(k);p2k.push(k);
    mark(`q2-${i}`,k===4,`Đúng ${k}/4 ý · ${fmt(p2score(k))} điểm`);
  });
  P3.forEach((p,i)=>{
    const v=norm(document.getElementById('a3-'+i).value);
    const ok=v!==''&&Math.abs(parseFloat(v)-parseFloat(p.a))<1e-9;
    if(ok){s3+=0.5;c3++}
    mark(`q3-${i}`,ok,ok?'Đúng':`Sai · Đáp án đúng: ${p.a}`);
  });
  return {s1,c1,s2,p2k,s3,c3};
}
function mark(id,ok,text){
  const q=document.getElementById(id);
  const t=document.createElement('span');
  t.className='tag '+(ok?'ok':'bad');t.textContent=text;
  q.querySelector('.q-head').appendChild(t);
}

document.getElementById('submit').addEventListener('click',()=>{
  const warn=document.getElementById('warn');
  if(locked)return;
  const n=answered();
  if(n===0){warn.textContent='Bạn chưa trả lời câu nào.';return}
  if(n<TOTAL && !window._confirmSkip){
    warn.textContent=`Còn ${TOTAL-n} câu chưa làm. Bấm Nộp bài lần nữa để nộp luôn.`;
    window._confirmSkip=true;return;
  }
  warn.textContent='';
  locked=true;
  const r=grade();
  const total=r.s1+r.s2+r.s3, max=3+4+2;
  const name=document.getElementById('name').value.trim();
  const res=document.getElementById('result');
  res.className='result';res.hidden=false;
  res.innerHTML=`<h2>${name?'Kết quả của '+name.replace(/[<>&]/g,''):'Kết quả bài làm'}</h2>
   <div class="score">${fmt(total)}<small> / ${max} điểm</small></div>
   <p class="lead">Quy đổi thang 10: <b>${fmt(total/max*10)}</b></p>
   <div class="break">
    <div>Phần I<b>${r.c1}/12 câu · ${fmt(r.s1)}đ</b></div>
    <div>Phần II<b>${r.p2k.join(' · ')} ý đúng · ${fmt(r.s2)}đ</b></div>
    <div>Phần III<b>${r.c3}/4 câu · ${fmt(r.s3)}đ</b></div>
   </div>
   <p class="fb">Kéo lên để xem câu nào đúng, câu nào sai.</p>
   <div class="submit"><button class="ghost" id="redo" type="button">Làm lại</button></div>`;
  document.getElementById('submit').disabled=true;
  document.querySelectorAll('input').forEach(e=>{if(e.id!=='name')e.disabled=true});
  document.getElementById('redo').onclick=()=>location.reload();
  res.scrollIntoView({behavior:'smooth',block:'start'});
});
</script>
